name: Integration Test

on:
  push:
    branches: [main, init-main, v1]
  pull_request:
    branches: [main, init-main, v1]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-bump:
    name: Version bump check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate VERSION bump
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ ! -f VERSION ]; then
            echo "::error::VERSION file is missing"
            exit 1
          fi

          if ! grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION; then
            echo "::error::VERSION must be strict semver (e.g. 1.2.3)"
            exit 1
          fi

          git fetch --no-tags origin "$BASE_REF":"refs/remotes/origin/$BASE_REF"

          if git diff --quiet "refs/remotes/origin/$BASE_REF"...HEAD -- VERSION; then
            echo "::error::VERSION must be bumped in pull requests"
            exit 1
          fi

          echo "VERSION bump detected: $(cat VERSION)"

  # ───────────────────────────────────────────────────────────────────
  # Dogfood: capture traffic to this repo's GitHub page, generate
  # a site map, run ZAP passive scan, and upload SARIF to Security tab
  # ───────────────────────────────────────────────────────────────────
  test-dogfood:
    name: "Dogfood: ${{ matrix.scenario.label }} (${{ matrix.platform.label }}, ${{ matrix.proxy-tool }})"
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - label: Linux
            id: linux-arm64
            runner: ubuntu-24.04-arm
            kind: linux
          - label: Linux (AMD64)
            id: linux-amd64
            runner: ubuntu-24.04
            kind: linux
        proxy-tool: [fluxzy, mitmproxy]
        scenario:
          - label: capture & analyze github.com
            target: github
            strip-bodies: 'false'
          - label: strip bodies for juice-shop.github.io
            target: juice-shop
            strip-bodies: 'true'
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Start capture via capture-pcap-action
        id: capture-start
        uses: caseware/capture-pcap-action/start@v1
        with:
          proxy-tool: ${{ matrix.proxy-tool }}
          strip-response-bodies: ${{ matrix.scenario.strip-bodies }}
          strip-body-domains: 'juice-shop.github.io'
          strip-body-content-types: 'text/html,image/,text/css,application/javascript,font/'

      - name: Generate traffic through action-managed proxy
        shell: bash
        env:
          TARGET_SCENARIO: ${{ matrix.scenario.target }}
        run: |
          set -euo pipefail
          if [ "$TARGET_SCENARIO" = "juice-shop" ]; then
            curl -sS --max-time 30 "https://juice-shop.github.io/" -o /dev/null || true
            curl -sS --max-time 30 "https://juice-shop.github.io/juice-shop.svg" -o /dev/null || true
            curl -sS --max-time 30 "https://juice-shop.github.io/assets/public/images/JuiceShop_Logo.png" -o /dev/null || true
          else
            curl -sS --max-time 30 "https://github.com/caseware/analyze-pcap-dast-action" -o /dev/null || true
            curl -sS --max-time 30 "https://github.com/caseware" -o /dev/null || true
            curl -sS --max-time 30 "https://api.github.com/repos/caseware/analyze-pcap-dast-action" -o /dev/null || true
          fi

      - name: Stop capture via capture-pcap-action
        id: capture-stop
        if: always()
        uses: caseware/capture-pcap-action/stop@v1
        with:
          capture-dir: ${{ steps.capture-start.outputs.capture-dir }}
          artifact-name: dogfood-${{ matrix.platform.id }}-${{ matrix.proxy-tool }}-${{ matrix.scenario.target }}

      - name: Generate passive DAST site map from local capture
        shell: bash
        env:
          CAPTURE_DIR: ${{ steps.capture-start.outputs.capture-dir }}
        run: |
          set -euo pipefail
          OUTPUT_DIR="$RUNNER_TEMP/dast-map"
          mkdir -p "$OUTPUT_DIR/captures"

          if [ ! -f "$CAPTURE_DIR/capture.har" ]; then
            echo "::error::capture.har missing in $CAPTURE_DIR"
            ls -la "$CAPTURE_DIR" || true
            exit 1
          fi

          cp "$CAPTURE_DIR/capture.har" "$OUTPUT_DIR/captures/capture.har"

          python3 scripts/flows-to-sitemap.py \
            --captures-dir "$OUTPUT_DIR/captures" \
            --output-dir "$OUTPUT_DIR"

          HAR_FILE="$OUTPUT_DIR/sitemap.har"
          URL_LIST="$OUTPUT_DIR/urls.txt"
          BURP_XML="$OUTPUT_DIR/sitemap-burp.xml"
          URL_COUNT=$(wc -l < "$URL_LIST" 2>/dev/null || echo 0)
          DOMAIN_COUNT=$(awk -F/ '{print $3}' "$URL_LIST" 2>/dev/null | sort -u | wc -l || echo 0)

          echo "HAR_FILE=$HAR_FILE" >> "$GITHUB_ENV"
          echo "URL_LIST=$URL_LIST" >> "$GITHUB_ENV"
          echo "BURP_XML=$BURP_XML" >> "$GITHUB_ENV"
          echo "URL_COUNT=$URL_COUNT" >> "$GITHUB_ENV"
          echo "DOMAIN_COUNT=$DOMAIN_COUNT" >> "$GITHUB_ENV"

      - name: Verify strip markers in HAR
        if: matrix.scenario.strip-bodies == 'true'
        shell: bash
        env:
          HAR_FILE: ${{ env.HAR_FILE }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          har_path = Path(os.environ["HAR_FILE"])
          data = json.loads(har_path.read_text(encoding="utf-8"))
          entries = data.get("log", {}).get("entries", [])

          strip_hits = 0
          juice_hits = 0
          for entry in entries:
              req = entry.get("request", {})
              res = entry.get("response", {})
              url = str(req.get("url", ""))
              if "juice-shop.github.io" not in url:
                  continue
              juice_hits += 1
              headers = {h.get("name", "").lower(): h.get("value", "") for h in res.get("headers", [])}
              if headers.get("x-capture-body-stripped", "").lower() == "true":
                  strip_hits += 1

          print(f"juice entries: {juice_hits}, stripped markers: {strip_hits}")
          if juice_hits == 0:
              raise SystemExit("No juice-shop entries found in HAR")
          if strip_hits == 0:
              raise SystemExit("No stripped response markers found in HAR")
          PY

      - name: Verify site map outputs
        shell: bash
        run: |
          set -euo pipefail
          echo "=== HAR ==="
          if [ -f "$HAR_FILE" ]; then
            SIZE=$(python -c "import os; from pathlib import Path; print(Path(os.environ['HAR_FILE']).stat().st_size)")
            ENTRIES=$(python -c "import json, os; print(len(json.load(open(os.environ['HAR_FILE']))['log']['entries']))")
            echo "HAR: $SIZE bytes, $ENTRIES entries"
            [ "$SIZE" -gt 100 ] || { echo "::error::HAR too small"; exit 1; }
          else
            echo "::error::HAR file missing"; exit 1
          fi

          echo "=== URL list ==="
          if [ -f "$URL_LIST" ]; then
            cat "$URL_LIST"
            LINES=$(python -c "import os; from pathlib import Path; print(len(Path(os.environ['URL_LIST']).read_text().splitlines()))")
            echo "URLs: $LINES"
            [ "$LINES" -gt 0 ] || { echo "::error::URL list empty"; exit 1; }
          else
            echo "::error::URL list missing"; exit 1
          fi

          echo "=== Burp XML ==="
          if [ -f "$BURP_XML" ]; then
            SIZE=$(python -c "import os; from pathlib import Path; print(Path(os.environ['BURP_XML']).stat().st_size)")
            echo "Burp XML: $SIZE bytes"
            [ "$SIZE" -gt 100 ] || { echo "::error::Burp XML too small"; exit 1; }
          else
            echo "::error::Burp XML missing"; exit 1
          fi

          echo "URL count: ${URL_COUNT:-n/a}"
          echo "Domain count: ${DOMAIN_COUNT:-n/a}"

      - name: Extract Burp XML statistics
        shell: bash
        env:
          TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python scripts/burp-xml-stats.py "$BURP_XML" -o "$TEMP_DIR/burp-stats.json"
          echo "=== Burp XML Stats ==="
          cat "$TEMP_DIR/burp-stats.json"

          URL_COUNT=$(python -c "import json, os; s=json.load(open(os.environ['TEMP_DIR'] + '/burp-stats.json')); print(s['url_count'])")
          echo "Extracted $URL_COUNT URLs from Burp XML"
          [ "$URL_COUNT" -gt 0 ] || { echo "::error::Burp XML has 0 URLs"; exit 1; }

      - name: Run DAST passive analysis
        if: runner.os == 'Linux'
        uses: ./analyze-pcap-dast
        id: dast
        with:
          har-file: ${{ env.HAR_FILE }}
          fail-on-risk: 'none'
          upload-sarif: 'true'

      - name: Verify DAST outputs
        if: runner.os == 'Linux'
        shell: bash
        env:
          SARIF_FILE: ${{ steps.dast.outputs.sarif-file }}
          ALERT_COUNT: ${{ steps.dast.outputs.alert-count }}
          HIGH_COUNT: ${{ steps.dast.outputs.high-count }}
          MEDIUM_COUNT: ${{ steps.dast.outputs.medium-count }}
          LOW_COUNT: ${{ steps.dast.outputs.low-count }}
        run: |
          set -euo pipefail
          echo "SARIF file: $SARIF_FILE"
          echo "Alerts: $ALERT_COUNT"
          echo "  High: $HIGH_COUNT"
          echo "  Medium: $MEDIUM_COUNT"
          echo "  Low: $LOW_COUNT"

          if [ -f "$SARIF_FILE" ]; then
            SIZE=$(python -c "import os; from pathlib import Path; print(Path(os.environ['SARIF_FILE']).stat().st_size)")
            echo "SARIF size: $SIZE bytes"
            # Verify it's valid JSON
            python -c "import json, os; json.load(open(os.environ['SARIF_FILE']))"
            echo "SARIF is valid JSON"
          else
            echo "::error::SARIF file missing"; exit 1
          fi

