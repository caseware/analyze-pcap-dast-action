name: Integration Test

on:
  push:
    branches: [main, init-main, v1]
  pull_request:
    branches: [main, init-main, v1]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-bump:
    name: Version bump check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate VERSION bump
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ ! -f VERSION ]; then
            echo "::error::VERSION file is missing"
            exit 1
          fi

          if ! grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION; then
            echo "::error::VERSION must be strict semver (e.g. 1.2.3)"
            exit 1
          fi

          git fetch --no-tags origin "$BASE_REF":"refs/remotes/origin/$BASE_REF"

          if git diff --quiet "refs/remotes/origin/$BASE_REF"...HEAD -- VERSION; then
            echo "::error::VERSION must be bumped in pull requests"
            exit 1
          fi

          echo "VERSION bump detected: $(cat VERSION)"

  # ───────────────────────────────────────────────────────────────────
  # Dogfood: capture traffic to this repo's GitHub page, generate
  # a site map, run ZAP passive scan, and upload SARIF to Security tab
  # ───────────────────────────────────────────────────────────────────
  test-dogfood:
    name: "Dogfood: capture & analyze github.com (${{ matrix.platform.label }}, ${{ matrix.proxy-tool }})"
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - label: Linux
            runner: ubuntu-24.04-arm
            kind: linux
          - label: Linux (AMD64)
            runner: ubuntu-24.04
            kind: linux
          - label: Windows
            runner: windows-2022
            kind: windows
          - label: macOS (arm64)
            runner: macos-26
            kind: macos
          - label: macOS (x64)
            runner: macos-26-intel
            kind: macos
        proxy-tool: [fluxzy, mitmproxy]
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mitmproxy
        if: matrix.proxy-tool == 'mitmproxy'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet mitmproxy==11.0.2
          SCRIPTS_DIR="$(python -c 'import sysconfig; print(sysconfig.get_path("scripts"))')"
          echo "$SCRIPTS_DIR" >> "$GITHUB_PATH"
          export PATH="$SCRIPTS_DIR:$PATH"

      - name: Install Fluxzy
        if: matrix.proxy-tool == 'fluxzy'
        run: npm install -g @fluxzy/cli

      - name: Start MinIO
        shell: bash
        run: |
          set -euo pipefail
          MINIO_DATA="$RUNNER_TEMP/minio-data"
          mkdir -p "$MINIO_DATA"

          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64|amd64) ARCH_TAG="amd64" ;;
            arm64|aarch64) ARCH_TAG="arm64" ;;
            *)
              echo "::error::Unsupported architecture for MinIO: $ARCH"
              exit 1
              ;;
          esac

          case "$RUNNER_OS" in
            Linux)
              MINIO_URL="https://dl.min.io/server/minio/release/linux-${ARCH_TAG}/minio"
              MINIO_BIN="$RUNNER_TEMP/minio"
              ;;
            macOS)
              MINIO_URL="https://dl.min.io/server/minio/release/darwin-${ARCH_TAG}/minio"
              MINIO_BIN="$RUNNER_TEMP/minio"
              ;;
            Windows)
              MINIO_URL="https://dl.min.io/server/minio/release/windows-amd64/minio.exe"
              MINIO_BIN="$RUNNER_TEMP/minio.exe"
              ;;
            *)
              echo "::error::Unsupported runner OS for MinIO: $RUNNER_OS"
              exit 1
              ;;
          esac

          echo "Downloading MinIO from: $MINIO_URL"
          curl -fsSL "$MINIO_URL" -o "$MINIO_BIN"
          if [ "$RUNNER_OS" != "Windows" ]; then
            chmod +x "$MINIO_BIN"
          fi

          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin \
            "$MINIO_BIN" server "$MINIO_DATA" --address ":9000" --console-address ":9001" \
            > "$RUNNER_TEMP/minio.log" 2>&1 &
          echo "MINIO_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for MinIO
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for MinIO..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null 2>&1; then
              echo "MinIO is ready"
              break
            fi
            sleep 1
          done

      - name: Configure AWS CLI for MinIO
        shell: bash
        run: |
          set -euo pipefail
          aws configure set aws_access_key_id minioadmin
          aws configure set aws_secret_access_key minioadmin
          aws configure set default.region us-east-1
          aws s3 mb s3://test-pcap --endpoint-url http://localhost:9000 || true

      - name: Capture traffic via selected proxy
        shell: bash
        env:
          PROXY_TOOL: ${{ matrix.proxy-tool }}
        run: |
          set -euo pipefail
          PROXY_PID=""
          cleanup() {
            if [ -n "${PROXY_PID:-}" ]; then
              kill -TERM "$PROXY_PID" 2>/dev/null || true
              for i in $(seq 1 10); do
                if ! kill -0 "$PROXY_PID" 2>/dev/null; then
                  return
                fi
                sleep 1
              done
              kill -9 "$PROXY_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          CAPTURE_DIR="${RUNNER_TEMP}/capture"
          MITM_DIR="$CAPTURE_DIR/.mitmproxy"
          FLUXZY_DIR="$CAPTURE_DIR/.fluxzy"
          mkdir -p "$MITM_DIR" "$FLUXZY_DIR"
          export SSLKEYLOGFILE="$CAPTURE_DIR/sslkeys.log"

          if [ "$RUNNER_OS" = "Windows" ]; then
            FLUXZY_BIN="npx.cmd"
            CURL_BIN="curl.exe"
            NULL_OUT="NUL"
            USE_CACERT="false"
          else
            FLUXZY_BIN="npx"
            CURL_BIN="curl"
            NULL_OUT="/dev/null"
            USE_CACERT="true"
          fi

          if [ "$PROXY_TOOL" = "fluxzy" ]; then
            "$FLUXZY_BIN" --yes @fluxzy/cli cert export "$FLUXZY_DIR/fluxzy-ca.crt"
            CA_CERT="$FLUXZY_DIR/fluxzy-ca.crt"
            CAPTURE_FILE="$CAPTURE_DIR/fluxzy-capture.har"
            "$FLUXZY_BIN" @fluxzy/cli start \
              -l "127.0.0.1:8080" \
              -k \
              -o "$CAPTURE_FILE" \
              > "$CAPTURE_DIR/fluxzy-stdout.log" 2>&1 &
          else
            CAPTURE_FILE="$CAPTURE_DIR/mitmproxy-flows"
            CA_CERT="$MITM_DIR/mitmproxy-ca-cert.pem"
            mitmdump \
              --mode regular \
              --listen-port 8080 \
              --set confdir="$MITM_DIR" \
              --set ssl_insecure=true \
              --save-stream-file "$CAPTURE_FILE" \
              --quiet \
              > "$CAPTURE_DIR/mitmdump-stdout.log" 2>&1 &
          fi
          PROXY_PID=$!

          sleep 4

          if [ "$USE_CACERT" = "true" ]; then
            "$CURL_BIN" -sS --max-time 30 -x "http://127.0.0.1:8080" --cacert "$CA_CERT" "https://github.com/caseware/analyze-pcap-dast-action" -o "$NULL_OUT" || true
            "$CURL_BIN" -sS --max-time 30 -x "http://127.0.0.1:8080" --cacert "$CA_CERT" "https://github.com/caseware" -o "$NULL_OUT" || true
            "$CURL_BIN" -sS --max-time 30 -x "http://127.0.0.1:8080" --cacert "$CA_CERT" "https://api.github.com/repos/caseware/analyze-pcap-dast-action" -o "$NULL_OUT" || true
          else
            "$CURL_BIN" -sS --max-time 30 -x "http://127.0.0.1:8080" -k "https://github.com/caseware/analyze-pcap-dast-action" -o "$NULL_OUT" || true
            "$CURL_BIN" -sS --max-time 30 -x "http://127.0.0.1:8080" -k "https://github.com/caseware" -o "$NULL_OUT" || true
            "$CURL_BIN" -sS --max-time 30 -x "http://127.0.0.1:8080" -k "https://api.github.com/repos/caseware/analyze-pcap-dast-action" -o "$NULL_OUT" || true
          fi

          cleanup
          trap - EXIT

          for i in $(seq 1 10); do
            if [ -f "$CAPTURE_FILE" ] && [ -s "$CAPTURE_FILE" ]; then
              break
            fi
            sleep 1
          done

          if [ ! -f "$CAPTURE_FILE" ]; then
            echo "::error::Expected capture file missing: $CAPTURE_FILE"
            ls -la "$CAPTURE_DIR" || true
            exit 1
          fi
          if [ ! -s "$CAPTURE_FILE" ]; then
            echo "::error::Expected capture file is empty: $CAPTURE_FILE"
            ls -la "$CAPTURE_DIR" || true
            exit 1
          fi

          BUNDLE_DIR="$CAPTURE_DIR/bundle"
          mkdir -p "$BUNDLE_DIR"
          for f in mitmproxy-flows fluxzy-capture.har sslkeys.log; do
            [ -f "$CAPTURE_DIR/$f" ] && cp "$CAPTURE_DIR/$f" "$BUNDLE_DIR/"
          done
          [ -f "$CA_CERT" ] && cp "$CA_CERT" "$BUNDLE_DIR/"

          ARTIFACT="dogfood-$(date -u +%Y%m%dT%H%M%SZ)"
          tar -czf "$CAPTURE_DIR/$ARTIFACT.tar.gz" -C "$BUNDLE_DIR" .

          DATE_PARTITION=$(python -c "from datetime import datetime, timedelta, timezone; print((datetime.now(timezone.utc)-timedelta(days=1)).strftime('%Y/%m/%d'))")
          aws s3 cp "$CAPTURE_DIR/$ARTIFACT.tar.gz" \
            "s3://test-pcap/pcap-captures/$DATE_PARTITION/$ARTIFACT.tar.gz" \
            --endpoint-url http://localhost:9000

          echo "capture-dir=$CAPTURE_DIR" >> "$GITHUB_ENV"
          echo "Capture complete, uploaded to MinIO"

      - name: Create passive DAST site map
        uses: ./create-passive-dast-map
        id: sitemap
        with:
          s3-bucket: 'test-pcap'
          s3-prefix: 'pcap-captures'
          s3-endpoint: 'http://localhost:9000'
          days: '1'

      - name: Export site map paths
        env:
          HAR_FILE: ${{ steps.sitemap.outputs.har-file }}
          URL_LIST: ${{ steps.sitemap.outputs.url-list }}
          BURP_XML: ${{ steps.sitemap.outputs.burp-xml }}
          URL_COUNT: ${{ steps.sitemap.outputs.url-count }}
          DOMAIN_COUNT: ${{ steps.sitemap.outputs.domain-count }}
        run: |
          echo "HAR_FILE=$HAR_FILE" >> "$GITHUB_ENV"
          echo "URL_LIST=$URL_LIST" >> "$GITHUB_ENV"
          echo "BURP_XML=$BURP_XML" >> "$GITHUB_ENV"
          echo "URL_COUNT=$URL_COUNT" >> "$GITHUB_ENV"
          echo "DOMAIN_COUNT=$DOMAIN_COUNT" >> "$GITHUB_ENV"

      - name: Verify site map outputs
        shell: bash
        run: |
          set -euo pipefail
          echo "=== HAR ==="
          if [ -f "$HAR_FILE" ]; then
            SIZE=$(python -c "import os; from pathlib import Path; print(Path(os.environ['HAR_FILE']).stat().st_size)")
            ENTRIES=$(python -c "import json, os; print(len(json.load(open(os.environ['HAR_FILE']))['log']['entries']))")
            echo "HAR: $SIZE bytes, $ENTRIES entries"
            [ "$SIZE" -gt 100 ] || { echo "::error::HAR too small"; exit 1; }
          else
            echo "::error::HAR file missing"; exit 1
          fi

          echo "=== URL list ==="
          if [ -f "$URL_LIST" ]; then
            cat "$URL_LIST"
            LINES=$(python -c "import os; from pathlib import Path; print(len(Path(os.environ['URL_LIST']).read_text().splitlines()))")
            echo "URLs: $LINES"
            [ "$LINES" -gt 0 ] || { echo "::error::URL list empty"; exit 1; }
          else
            echo "::error::URL list missing"; exit 1
          fi

          echo "=== Burp XML ==="
          if [ -f "$BURP_XML" ]; then
            SIZE=$(python -c "import os; from pathlib import Path; print(Path(os.environ['BURP_XML']).stat().st_size)")
            echo "Burp XML: $SIZE bytes"
            [ "$SIZE" -gt 100 ] || { echo "::error::Burp XML too small"; exit 1; }
          else
            echo "::error::Burp XML missing"; exit 1
          fi

          echo "URL count: ${URL_COUNT:-n/a}"
          echo "Domain count: ${DOMAIN_COUNT:-n/a}"

      - name: Extract Burp XML statistics
        shell: bash
        env:
          TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python scripts/burp-xml-stats.py "$BURP_XML" -o "$TEMP_DIR/burp-stats.json"
          echo "=== Burp XML Stats ==="
          cat "$TEMP_DIR/burp-stats.json"

          URL_COUNT=$(python -c "import json, os; s=json.load(open(os.environ['TEMP_DIR'] + '/burp-stats.json')); print(s['url_count'])")
          echo "Extracted $URL_COUNT URLs from Burp XML"
          [ "$URL_COUNT" -gt 0 ] || { echo "::error::Burp XML has 0 URLs"; exit 1; }

      - name: Run DAST passive analysis
        uses: ./analyze-pcap-dast
        id: dast
        with:
          har-file: ${{ env.HAR_FILE }}
          fail-on-risk: 'none'
          upload-sarif: 'true'

      - name: Verify DAST outputs
        shell: bash
        env:
          SARIF_FILE: ${{ steps.dast.outputs.sarif-file }}
          ALERT_COUNT: ${{ steps.dast.outputs.alert-count }}
          HIGH_COUNT: ${{ steps.dast.outputs.high-count }}
          MEDIUM_COUNT: ${{ steps.dast.outputs.medium-count }}
          LOW_COUNT: ${{ steps.dast.outputs.low-count }}
        run: |
          set -euo pipefail
          echo "SARIF file: $SARIF_FILE"
          echo "Alerts: $ALERT_COUNT"
          echo "  High: $HIGH_COUNT"
          echo "  Medium: $MEDIUM_COUNT"
          echo "  Low: $LOW_COUNT"

          if [ -f "$SARIF_FILE" ]; then
            SIZE=$(python -c "import os; from pathlib import Path; print(Path(os.environ['SARIF_FILE']).stat().st_size)")
            echo "SARIF size: $SIZE bytes"
            # Verify it's valid JSON
            python -c "import json, os; json.load(open(os.environ['SARIF_FILE']))"
            echo "SARIF is valid JSON"
          else
            echo "::error::SARIF file missing"; exit 1
          fi

      - name: Stop MinIO
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MINIO_PID:-}" ]; then
            echo "MINIO_PID not set; nothing to stop"
            exit 0
          fi

          if [ "$RUNNER_OS" = "Windows" ]; then
            taskkill.exe /PID "$MINIO_PID" /T /F >/dev/null 2>&1 || true
          else
            kill -TERM "$MINIO_PID" 2>/dev/null || true
            sleep 1
            kill -9 "$MINIO_PID" 2>/dev/null || true
          fi
