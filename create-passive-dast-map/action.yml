name: 'Create Passive DAST Site Map'
description: |
  Downloads PCAP bundles from S3 (last N hours), extracts mitmproxy flows,
  and generates site maps compatible with ZAP, Burp Suite, and Rapid7.

  Output formats:
    - HAR (HTTP Archive 1.2) — universal, works with ZAP/Burp/Rapid7
    - URL list (text) — one URL per line, for ZAP import or Rapid7 bulk add
    - Burp XML site map — native Burp Suite import format
author: 'CaseWare'

inputs:
  s3-bucket:
    description: 'S3 bucket containing PCAP bundles.'
    required: true
  s3-prefix:
    description: 'S3 key prefix to search for bundles.'
    required: false
    default: 'pcap-captures'
  s3-endpoint:
    description: 'Custom S3 endpoint URL (MinIO, LocalStack, etc.).'
    required: false
    default: ''
  hours:
    description: 'Look back this many hours for PCAP bundles (default 24).'
    required: false
    default: '24'
  output-dir:
    description: 'Directory to write site map files.'
    required: false
    default: '${{ runner.temp }}/dast-map'
  filter-domains:
    description: 'Comma-separated domain allowlist (glob patterns). Only matching URLs appear in the map.'
    required: false
    default: ''
  filter-exclude-domains:
    description: 'Comma-separated domain denylist (glob patterns). Matching URLs are excluded.'
    required: false
    default: ''
  filter-status-codes:
    description: 'Comma-separated HTTP status codes to include (e.g. "200,301"). Empty = all.'
    required: false
    default: ''
  filter-methods:
    description: 'Comma-separated HTTP methods to include (e.g. "GET,POST"). Empty = all.'
    required: false
    default: ''

outputs:
  har-file:
    description: 'Path to the generated HAR file.'
    value: ${{ steps.generate.outputs.har-file }}
  url-list:
    description: 'Path to the generated URL list (one per line).'
    value: ${{ steps.generate.outputs.url-list }}
  burp-xml:
    description: 'Path to the generated Burp Suite XML site map.'
    value: ${{ steps.generate.outputs.burp-xml }}
  url-count:
    description: 'Total number of unique URLs in the site map.'
    value: ${{ steps.generate.outputs.url-count }}
  domain-count:
    description: 'Number of unique domains in the site map.'
    value: ${{ steps.generate.outputs.domain-count }}

runs:
  using: 'composite'
  steps:
    - name: Install Python dependencies
      shell: bash
      run: |
        pip install --quiet mitmproxy==11.1.3 2>/dev/null || \
          pip install --quiet --break-system-packages mitmproxy==11.1.3

    - name: Download and extract PCAP bundles from S3
      id: download
      shell: bash
      env:
        S3_BUCKET: ${{ inputs.s3-bucket }}
        S3_PREFIX: ${{ inputs.s3-prefix }}
        S3_ENDPOINT: ${{ inputs.s3-endpoint }}
        HOURS: ${{ inputs.hours }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        mkdir -p "$OUTPUT_DIR/bundles" "$OUTPUT_DIR/flows"

        ENDPOINT_FLAG=""
        if [ -n "$S3_ENDPOINT" ]; then
          ENDPOINT_FLAG="--endpoint-url $S3_ENDPOINT"
        fi

        # Unset proxy env vars to avoid routing S3 through a capture proxy
        unset HTTP_PROXY HTTPS_PROXY http_proxy https_proxy 2>/dev/null || true

        CUTOFF=$(date -u -d "$HOURS hours ago" +%Y-%m-%dT%H:%M:%S 2>/dev/null || \
                 date -u -v-${HOURS}H +%Y-%m-%dT%H:%M:%S)
        echo "Looking for bundles newer than $CUTOFF"

        BUNDLE_COUNT=0
        aws s3 ls "s3://$S3_BUCKET/$S3_PREFIX/" $ENDPOINT_FLAG \
          --recursive 2>/dev/null | while IFS= read -r line; do

          FILE_DATE=$(echo "$line" | awk '{print $1"T"$2}')
          FILE_KEY=$(echo "$line" | awk '{print $4}')

          if [[ "$FILE_KEY" != *.tar.gz ]]; then continue; fi
          if [[ "$FILE_DATE" < "$CUTOFF" ]]; then continue; fi

          BUNDLE_NAME=$(basename "$FILE_KEY" .tar.gz)
          BUNDLE_DIR="$OUTPUT_DIR/bundles/$BUNDLE_NAME"
          mkdir -p "$BUNDLE_DIR"

          echo "Downloading s3://$S3_BUCKET/$FILE_KEY"
          aws s3 cp "s3://$S3_BUCKET/$FILE_KEY" "$BUNDLE_DIR/bundle.tar.gz" \
            $ENDPOINT_FLAG --quiet

          tar -xzf "$BUNDLE_DIR/bundle.tar.gz" -C "$BUNDLE_DIR"

          if [ -f "$BUNDLE_DIR/mitmproxy-flows" ]; then
            cp "$BUNDLE_DIR/mitmproxy-flows" \
               "$OUTPUT_DIR/flows/${BUNDLE_NAME}.flows"
            BUNDLE_COUNT=$((BUNDLE_COUNT + 1))
          fi
        done

        echo "Downloaded bundles with flow files"
        ls -la "$OUTPUT_DIR/flows/" 2>/dev/null || echo "(no flows found)"
        echo "output-dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

    - name: Generate site maps from mitmproxy flows
      id: generate
      shell: bash
      env:
        OUTPUT_DIR: ${{ inputs.output-dir }}
        FILTER_DOMAINS: ${{ inputs.filter-domains }}
        FILTER_EXCLUDE_DOMAINS: ${{ inputs.filter-exclude-domains }}
        FILTER_STATUS_CODES: ${{ inputs.filter-status-codes }}
        FILTER_METHODS: ${{ inputs.filter-methods }}
      run: |
        SCRIPT_DIR="${{ github.action_path }}/../scripts"
        python3 "$SCRIPT_DIR/flows-to-sitemap.py" \
          --flows-dir "$OUTPUT_DIR/flows" \
          --output-dir "$OUTPUT_DIR" \
          --filter-domains "$FILTER_DOMAINS" \
          --filter-exclude-domains "$FILTER_EXCLUDE_DOMAINS" \
          --filter-status-codes "$FILTER_STATUS_CODES" \
          --filter-methods "$FILTER_METHODS"

        echo "har-file=$OUTPUT_DIR/sitemap.har" >> "$GITHUB_OUTPUT"
        echo "url-list=$OUTPUT_DIR/urls.txt" >> "$GITHUB_OUTPUT"
        echo "burp-xml=$OUTPUT_DIR/sitemap-burp.xml" >> "$GITHUB_OUTPUT"

        URL_COUNT=$(wc -l < "$OUTPUT_DIR/urls.txt" 2>/dev/null || echo 0)
        DOMAIN_COUNT=$(awk -F/ '{print $3}' "$OUTPUT_DIR/urls.txt" \
          2>/dev/null | sort -u | wc -l || echo 0)
        echo "url-count=$URL_COUNT" >> "$GITHUB_OUTPUT"
        echo "domain-count=$DOMAIN_COUNT" >> "$GITHUB_OUTPUT"

        echo "::notice::Site map generated: $URL_COUNT URLs across $DOMAIN_COUNT domains"
